    function resolvePlanManagers() {
      if (!state.access || !state.access.role) return [];
      if (state.access.role !== 'Керівник') {
        return [state.access.manager].filter(Boolean);
      }
      const current = state.filters.manager || 'усього';
      if (!current || current === 'усього') return [];
      return [current];
    }

    function resolvePlanForMonth(planMap, monthKey, managersFilter) {
      if (!planMap || !monthKey) return 0;
      const rec = planMap[monthKey];
      if (!rec) return 0;
      if (!managersFilter || managersFilter.length === 0) return num(rec.total);
      let sum = 0;
      managersFilter.forEach((m) => {
        sum += num(rec.byManager && rec.byManager[m]);
      });
      return sum;
    }

    function applyPreset(preset) {
      const today = new Date();
      let start;
      let end;

      if (preset === 'week') {
        const currentWeekMonday = new Date(today);
        const day = currentWeekMonday.getDay() === 0 ? 7 : currentWeekMonday.getDay();
        currentWeekMonday.setDate(currentWeekMonday.getDate() - day + 1);
        start = new Date(currentWeekMonday);
        start.setDate(start.getDate() - 7);
        end = new Date(start);
        end.setDate(end.getDate() + 6);
      } else if (preset === 'month') {
        end = new Date(today);
        start = new Date(today.getFullYear(), today.getMonth(), 1);
      } else if (preset === 'prevMonth') {
        start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        end = new Date(today.getFullYear(), today.getMonth(), 0);
      } else {
        start = new Date(today);
        start.setDate(start.getDate() - 1);
        end = new Date(start);
        preset = 'day';
      }

      state.range.preset = preset;
      state.range.start = toDateKey(start);
      state.range.end = toDateKey(end);

      state.picker.tempStart = state.range.start;
      state.picker.tempEnd = state.range.end;
      state.picker.viewMonth = new Date(start.getFullYear(), start.getMonth(), 1);

      highlightPresetButtons();
      updateDatePopoverRangeText();
      updateRangeTexts();
      toggleDatePopover(false);
      ensureDataLoaded(false).then(renderFromCache).catch(handleUiError);
    }

    function toggleDatePopover(show) {
      const pop = document.getElementById('datePopover');
      state.picker.visible = !!show;
      if (!show) {
        pop.classList.add('d-none');
        return;
      }

      state.picker.tempStart = state.range.start;
      state.picker.tempEnd = state.range.end;
      state.picker.viewMonth = new Date(fromDateKey(state.range.start).getFullYear(), fromDateKey(state.range.start).getMonth(), 1);

      renderCalendar();
      highlightPresetButtons();
      updateDatePopoverRangeText();
      pop.classList.remove('d-none');
    }

    function shiftCalendarMonth(delta) {
      const vm = state.picker.viewMonth;
      state.picker.viewMonth = new Date(vm.getFullYear(), vm.getMonth() + delta, 1);
      renderCalendar();
    }

    function renderCalendar() {
      const vm = state.picker.viewMonth;
      const year = vm.getFullYear();
      const month = vm.getMonth();
      const first = new Date(year, month, 1);
      const last = new Date(year, month + 1, 0);
      const offset = (first.getDay() + 6) % 7;

      document.getElementById('calTitle').textContent = monthTitle(vm);
      document.getElementById('calWeekdays').innerHTML = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд']
        .map((d) => `<div class="cal-weekday">${d}</div>`).join('');

      const cells = [];
      for (let i = 0; i < offset; i++) cells.push(null);
      for (let d = 1; d <= last.getDate(); d++) cells.push(new Date(year, month, d));
      while (cells.length < 42) cells.push(null);

      const start = state.picker.tempStart;
      const end = state.picker.tempEnd || start;

      document.getElementById('calDays').innerHTML = cells.map((date) => {
        if (!date) return '<button class="cal-day muted" type="button" disabled></button>';

        const key = toDateKey(date);
        const isStart = start && key === start;
        const isEnd = end && key === end;
        const inRange = start && end && key >= start && key <= end;

        let cls = 'cal-day';
        if (isStart) cls += ' start';
        if (isEnd && end !== start) cls += ' end';
        if (inRange) cls += ' in-range';

        return `<button class="${cls}" type="button" data-date="${key}">${date.getDate()}</button>`;
      }).join('');

      document.querySelectorAll('#calDays [data-date]').forEach((btn) => {
        btn.addEventListener('click', () => onCalendarDayClick(btn.dataset.date));
      });
    }

    function onCalendarDayClick(key) {
      if (!state.picker.tempStart || (state.picker.tempStart && state.picker.tempEnd)) {
        state.picker.tempStart = key;
        state.picker.tempEnd = '';
      } else {
        if (key < state.picker.tempStart) {
          state.picker.tempEnd = state.picker.tempStart;
          state.picker.tempStart = key;
        } else {
          state.picker.tempEnd = key;
        }
      }

      state.range.preset = 'custom';
      highlightPresetButtons();
      renderCalendar();
      updateDatePopoverRangeText();
    }

    function applyDateSelection() {
      if (!state.picker.tempStart) {
        showToast('Оберіть дату або діапазон');
        return;
      }

      state.range.start = state.picker.tempStart;
      state.range.end = state.picker.tempEnd || state.picker.tempStart;
      state.range.preset = 'custom';

      updateRangeTexts();
      toggleDatePopover(false);
      ensureDataLoaded(false).then(renderFromCache).catch(handleUiError);
    }

    function updateDatePopoverRangeText() {
      const start = state.picker.tempStart;
      const end = state.picker.tempEnd || state.picker.tempStart;
      const text = start ? `${formatDateLong(start)} — ${formatDateLong(end)}` : 'Оберіть дату';
      document.getElementById('dateRangeText').textContent = text;
    }

    function updateRangeTexts() {
      const label = `${formatDateLong(state.range.start)} — ${formatDateLong(state.range.end)}`;
      document.getElementById('dateTriggerLabel').textContent = label;
    }

    function highlightPresetButtons() {
      document.querySelectorAll('[data-preset]').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.preset === state.range.preset);
      });
    }

    function monthTitle(date) {
      return date.toLocaleDateString('uk-UA', { month: 'long', year: 'numeric' });
    }

    async function apiGet(params) {
      if (DEBUG) params.debug = '1';
      const q = new URLSearchParams(params).toString();
      const url = `${API_URL}?${q}`;
      if (DEBUG) pushDebug('GET ' + url);

      const attempt = async () => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 20000);
        try {
          const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
          if (!res.ok) {
            throw new Error('http_' + res.status);
          }
          return await res.json();
        } finally {
          clearTimeout(timeout);
        }
      };

      try {
        return await attempt();
      } catch (err) {
        // one fast retry for transient errors
        if (DEBUG) pushDebug('apiGet retry due to: ' + String(err && err.message ? err.message : err));
        return await attempt();
      }
    }

    function isRegisterPage() {
      if (urlParams.get('register') === '1') return true;
      return window.location.pathname.endsWith('/register') || window.location.pathname.endsWith('/register/');
    }

    async function initRegisterPage() {
      document.getElementById('filtersCard').classList.add('d-none');
      document.getElementById('uiUserRole').textContent = 'Реєстрація';
      document.getElementById('uiUserName').textContent = 'Виберіть менеджера';
      document.getElementById('appContent').innerHTML = `
        <div class="panel-card p-3">
          <div class="section-title">Реєстрація</div>
          <div class="small text-muted mb-2">Оберіть свого менеджера зі списку.</div>
          <div class="mb-3">
            <label class="field-label">Менеджер</label>
            <select class="field-select" id="registerManager"></select>
          </div>
          <button class="btn btn-dark w-100" id="registerSubmit">Зареєструватись</button>
          <div class="muted-note mt-2" id="registerHint">Після відправки заявка буде на розгляді.</div>
        </div>
      `;

      if (!USER_ID) {
        showErrorCard('Не вказано User ID');
        return;
      }

      try {
        const access = await apiGet({ action: 'getAccess', userId: USER_ID });
        if (access && access.manager) {
          if (access.role) {
            document.getElementById('appContent').innerHTML = `
              <div class="panel-card p-3">
                <div class="section-title">Доступ активний</div>
                <div class="muted-note">Ваш доступ уже підтверджено.</div>
              </div>
            `;
            return;
          }
          document.getElementById('appContent').innerHTML = `
            <div class="panel-card p-3">
              <div class="section-title">Заявка на розгляді</div>
              <div class="muted-note">Ваша заявка вже відправлена. Очікуйте підтвердження.</div>
            </div>
          `;
          return;
        }
      } catch (e) {
        // ignore access errors and still allow registration
      }

      try {
        const res = await apiGet({ action: 'getManagersList', excludeUsed: '1' });
        const list = (res && res.managers && res.managers.length) ? res.managers : [];
        const select = document.getElementById('registerManager');
        select.innerHTML = list.map((m) => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
        document.getElementById('registerSubmit').addEventListener('click', () => submitRegistration());
      } catch (e) {
        showErrorCard('Не вдалося завантажити список менеджерів');
      }
    }

    async function submitRegistration() {
      const select = document.getElementById('registerManager');
      if (!select || !select.value) {
        showToast('Оберіть менеджера зі списку.');
        return;
      }
      if (!USER_ID) {
        showToast('Немає userid у посиланні. Відкрийте форму з Telegram.');
        const hint = document.getElementById('registerHint');
        if (hint) hint.textContent = 'Помилка: немає userid у посиланні. Відкрийте цю форму з кнопки бота.';
        return;
      }
      const payload = { manager: select.value, userId: USER_ID || '' };
      const hint = document.getElementById('registerHint');
      if (hint) hint.textContent = 'Відправляємо заявку...';

      let res = null;
      try {
        res = await apiGet({ action: 'register', userId: USER_ID || '', manager: select.value });
      } catch (e) {
        showToast('Помилка відправки. Перевірте доступ до API.');
        if (hint) hint.textContent = 'Помилка відправки. Перевірте доступ до API.';
        return;
      }

      if (res && res.ok) {
        showToast('Заявка відправлена.');
        if (hint) hint.textContent = 'Заявка на розгляді. Очікуйте підтвердження.';
        const btn = document.getElementById('registerSubmit');
        if (btn) btn.disabled = true;
      } else {
        const err = res && res.error ? res.error : 'невідомо';
        showToast('Помилка: ' + err);
        if (hint) hint.textContent = 'Помилка: ' + err;
      }

      if (window.Telegram && window.Telegram.WebApp) {
        try {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.sendData(JSON.stringify(payload));
          window.Telegram.WebApp.close();
        } catch (e) {
          // ignore
        }
      }
    }

    function showErrorCard(msg) {
      document.getElementById('appContent').innerHTML = `<div class="alert alert-danger">${escapeHtml(msg)}</div>`;
    }

    function handleUiError(err) {
      console.error(err);
      showToast('Помилка: ' + (err && err.message ? err.message : String(err)));
      pushDebug('UI error: ' + String(err));
      showDebugIfNeeded();
    }

    // -------------------------
    // Plans UI (Керівник only)
    // -------------------------

    function monthOptionsForCurrentYear_() {
      const now = new Date();
      const y = now.getFullYear();
      const out = [];
      for (let m = 0; m < 12; m++) {
        const d = new Date(y, m, 1);
        const label = d.toLocaleDateString('uk-UA', { month: 'long' });
        const value = `${y}-${String(m + 1).padStart(2, '0')}-01`;
        out.push({ value, label: label.charAt(0).toUpperCase() + label.slice(1) });
      }
      return out;
    }

    async function openPlansModal() {
      if (!state.access || state.access.role !== 'Керівник') {
        showToast('Недостатньо прав');
        return;
      }

      const select = document.getElementById('plansMonth');
      if (!select.dataset.inited) {
        const opts = monthOptionsForCurrentYear_();
        select.innerHTML = opts.map(o => `<option value="${o.value}">${escapeHtml(o.label)}</option>`).join('');
        const now = new Date();
        const current = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
        select.value = current;
        select.dataset.inited = '1';
      }

      const modalEl = document.getElementById('plansModal');
      const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
      modal.show();

      await loadPlansForSelectedMonth();
    }

    async function loadPlansForSelectedMonth() {
      const month = document.getElementById('plansMonth').value;
      const hint = document.getElementById('plansHint');
      hint.textContent = 'Завантаження...';

      const res = await apiGet({ action: 'getSalesPlans', userId: USER_ID, month });
      if (!res || res.error) throw new Error(res && res.error ? res.error : 'plans_load_failed');

      state.plans.month = res.month;
      state.plans.existing = res.plans || [];
      state.plans.availableManagers = res.availableManagers || [];

      renderPlansTable();
      hint.textContent = '';
    }

    function renderPlansTable() {
      const tbody = document.getElementById('plansTbody');
      const rows = (state.plans.existing || []).slice();

      tbody.innerHTML = rows.map((p, idx) => {
        return `
          <tr data-kind="existing" data-idx="${idx}">
            <td><strong>${escapeHtml(p.manager || '—')}</strong></td>
            <td><input class="form-control form-control-sm plan-amount" inputmode="numeric" value="${escapeHtml(String(p.plan || ''))}" /></td>
            <td></td>
          </tr>
        `;
      }).join('');

      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-muted">Немає планів за цей місяць.</td></tr>`;
      }
    }

    function addPlanRow() {
      const tbody = document.getElementById('plansTbody');
      const options = (state.plans.availableManagers || []).slice();
      if (!options.length) {
        showToast('Немає доступних менеджерів для додавання');
        return;
      }

      if (tbody.querySelectorAll('tr').length === 1 && tbody.textContent.includes('Немає планів')) {
        tbody.innerHTML = '';
      }

      const optHtml = ['<option value="">— Оберіть менеджера —</option>']
        .concat(options.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`))
        .join('');

      const tr = document.createElement('tr');
      tr.dataset.kind = 'new';
      tr.innerHTML = `
        <td><select class="form-select form-select-sm plan-manager">${optHtml}</select></td>
        <td><input class="form-control form-control-sm plan-amount" inputmode="numeric" placeholder="0" /></td>
        <td class="text-end"><button class="btn btn-sm btn-outline-danger">Видалити</button></td>
      `;

      tr.querySelector('button').addEventListener('click', () => tr.remove());
      tbody.appendChild(tr);

      // Do NOT preselect a manager. Reserve manager only after user selects it.
      tr.querySelector('select').addEventListener('change', (e) => {
        const val = String(e.target.value || '').trim();
        if (!val) return;
        state.plans.availableManagers = state.plans.availableManagers.filter(m => m !== val);
      });
    }

    async function savePlans() {
      const month = document.getElementById('plansMonth').value;
      const tbody = document.getElementById('plansTbody');

      const items = [];

      const existingRows = Array.from(tbody.querySelectorAll('tr[data-kind="existing"]'));
      existingRows.forEach((tr, i) => {
        const manager = (state.plans.existing[i] && state.plans.existing[i].manager) ? state.plans.existing[i].manager : '';
        const amountStr = tr.querySelector('.plan-amount')?.value || '';
        const plan = Number(String(amountStr).replace(/\s+/g, '').replace(',', '.'));
        if (manager && Number.isFinite(plan)) items.push({ manager, plan });
      });

      const newRows = Array.from(tbody.querySelectorAll('tr[data-kind="new"]'));
      newRows.forEach((tr) => {
        const manager = tr.querySelector('.plan-manager')?.value || '';
        const amountStr = tr.querySelector('.plan-amount')?.value || '';
        const plan = Number(String(amountStr).replace(/\s+/g, '').replace(',', '.'));
        if (manager && Number.isFinite(plan)) items.push({ manager, plan });
      });

      if (!items.length) {
        showToast('Немає даних для збереження');
        return;
      }

      const payload = btoa(unescape(encodeURIComponent(JSON.stringify(items))))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');

      const res = await apiGet({ action: 'saveSalesPlans', userId: USER_ID, month, payload });
      if (!res || res.error) throw new Error(res && res.error ? res.error : 'plans_save_failed');

      showToast('Плани збережено');

      // Close modal after save
      try {
        const modalEl = document.getElementById('plansModal');
        const modal = bootstrap.Modal.getInstance(modalEl) || bootstrap.Modal.getOrCreateInstance(modalEl);
        modal.hide();
      } catch (e) {}

      await loadPlansForSelectedMonth();
      await ensureDataLoaded(true);
      renderFromCache();
    }

    function applyKpiAutoFit_() {
      // Shrink large KPI values to fit on mobile cards.
      const nodes = document.querySelectorAll('[data-kpi-value]');
      nodes.forEach((el) => {
        const raw = (el.textContent || '').trim();
        // Count only digits (ignore spaces, slashes, currency symbols)
        const digits = raw.replace(/\D+/g, '').length;
        el.classList.remove('shrink-1', 'shrink-2', 'shrink-3');
        if (digits >= 13) el.classList.add('shrink-3');
        else if (digits >= 10) el.classList.add('shrink-2');
        else if (digits >= 8) el.classList.add('shrink-1');
      });
    }

    function showToast(msg) {
      state.lastToast = String(msg || '');
      const el = document.getElementById('toastMessage');
      el.textContent = state.lastToast;
      // Make error toasts clickable-to-copy.
      const isErr = state.lastToast.startsWith('Помилка') || state.lastToast.startsWith('Помилка ');
      el.style.cursor = isErr ? 'copy' : 'default';
      el.title = isErr ? 'Натисни, щоб скопіювати текст помилки' : '';

      if (!el.dataset.copyBound) {
        el.addEventListener('click', async () => {
          const text = String(state.lastToast || '');
          const isError = text.startsWith('Помилка') || text.startsWith('Помилка ');
          if (!isError) return;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(text);
              el.textContent = 'Скопійовано: ' + text;
              setTimeout(() => { el.textContent = text; }, 1600);
            }
          } catch (e) {
            // fallback: no clipboard permission
          }
        });
        el.dataset.copyBound = '1';
      }

      if (toastInstance && typeof toastInstance.show === 'function') {
        toastInstance.show();
      }
    }

    function pushDebug(line) {
      if (!DEBUG) return;
      if (Array.isArray(line)) line.forEach((x) => state.debugLines.push(String(x)));
      else state.debugLines.push(String(line));
    }

    function showDebugIfNeeded() {
      if (!DEBUG) return;
      const panel = document.getElementById('debugPanel');
      panel.classList.remove('d-none');
      document.getElementById('debugMeta').textContent = 'API: ' + API_URL;
      document.getElementById('debugBody').textContent = state.debugLines.join('\n');
    }

    function totalRowsCount(res) {
      const ds = res && res.datasets ? res.datasets : {};
      return (ds.ordersCreated || []).length + (ds.ordersCompleted || []).length + (ds.leadsCreated || []).length + (ds.leadsUpdated || []).length + (ds.ga4 || []).length;
    }

    function num(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : 0;
    }

    function fmtNumber(v) {
      return num(v).toLocaleString('uk-UA');
    }

    function fmtMoney(v) {
      return num(v).toLocaleString('uk-UA', { maximumFractionDigits: 0 }) + '\u00A0₴';
    }

    function fmtMoneyShort(v) {
      const n = num(v);
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'м';
      if (n >= 1000) return (n / 1000).toFixed(0) + 'к';
      return n.toFixed(0);
    }

    function fmtPercent(v) {
      return (num(v) * 100).toFixed(1) + '%';
    }

    function toDateKey(d) {
      const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function fromDateKey(key) {
      if (!key) return null;
      const p = String(key).split('-');
      if (p.length !== 3) return null;
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    }

    function formatDateLong(key) {
      const d = fromDateKey(key);
      return d ? d.toLocaleDateString('uk-UA') : key;
    }

    function formatDateShort(key) {
      const d = fromDateKey(key);
      if (!d) return key;
      return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function percentToColor(ratio) {
      const x = Math.max(0, Math.min(1.2, num(ratio)));
      const clamped = Math.max(0, Math.min(1, x));
      const r = Math.round(216 - (216 - 26) * clamped);
      const g = Math.round(60 + (157 - 60) * clamped);
      const b = Math.round(60 - (60 - 46) * clamped);
      return `rgb(${r},${g},${b})`;
    }

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
