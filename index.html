<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Статистика менеджерів</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

  <style>
    :root {
      --page-bg: #edf2f7;
      --card-bg: #ffffff;
      --line: #d8e2ec;
      --ink: #19232f;
      --muted: #6f7f90;
      --brand: #1458d7;
      --brand-soft: #e7efff;
      --good: #128a4a;
      --bad: #d33232;
      --accent: #ff9f1c;
    }

    body {
      margin: 0;
      padding: 18px 0 92px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(1200px 540px at 0% -15%, #dbe8ff 0%, transparent 56%),
        radial-gradient(900px 480px at 100% -20%, #d4f2e8 0%, transparent 52%),
        var(--page-bg);
      font-family: "SF Pro Display", "Segoe UI", "Helvetica Neue", sans-serif;
      overflow-x: hidden;
    }

    .page-shell {
      width: 100%;
      max-width: 1220px;
      margin-left: auto;
      margin-right: auto;
      --bs-gutter-x: 0;
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      box-sizing: border-box;
    }

    .panel-card {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card-bg);
      box-shadow: 0 8px 26px rgba(24, 43, 61, 0.06);
    }

    /* Keep the same spacing rhythm as the filters block */
    #filtersCard {
      padding: 16px !important;
      margin-bottom: 12px !important;
    }

    #appContent {
      display: grid;
      gap: 12px;
      width: 100%;
      max-width: 100%;
    }

    #appContent>.panel-card,
    #appContent>details.panel-card {
      padding: 16px !important;
      margin: 0;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }

    #appContent>details.panel-card>summary {
      width: 100%;
      box-sizing: border-box;
    }

    .panel-card,
    details.panel-card {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .chart-wrap svg {
      display: block;
      max-width: 100%;
    }

    .topline {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .role-badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 12px;
      color: #31475f;
      background: #fff;
      font-weight: 600;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .filters-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filters-toggle {
      border: 1px solid #c8d7e6;
      border-radius: 12px;
      background: #fff;
      color: #234664;
      min-height: 42px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .field-label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 700;
    }

    .field-btn,
    .field-select {
      border: 1px solid #cfdbe8;
      border-radius: 12px;
      min-height: 44px;
      font-size: 15px;
      padding: 10px 12px;
      width: 100%;
      background: #fff;
      color: var(--ink);
    }

    .field-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 600;
    }

    .field-btn:hover {
      border-color: #9bb5cf;
    }

    .date-picker-wrap {
      position: relative;
    }

    .date-popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: min(420px, 96vw);
      z-index: 30;
      border: 1px solid #c8d6e5;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 18px 34px rgba(18, 41, 68, 0.18);
      padding: 12px;
    }

    .preset-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .preset-btn {
      border: 1px solid #bfd0e2;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      background: #fff;
      color: #244b75;
    }

    .preset-btn.active {
      background: #deebff;
      border-color: #8fb4f0;
      color: #123f73;
    }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .calendar-title {
      font-size: 14px;
      font-weight: 700;
    }

    .cal-nav {
      border: 1px solid #c7d7e7;
      border-radius: 9px;
      width: 30px;
      height: 30px;
      background: #fff;
      color: #355675;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      user-select: none;
    }

    .cal-weekday {
      text-align: center;
      font-size: 10px;
      color: #7f8fa1;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .cal-day {
      height: 35px;
      border: 0;
      border-radius: 9px;
      font-size: 13px;
      background: transparent;
      color: #25374b;
      position: relative;
    }

    .cal-day:hover {
      background: #edf5ff;
    }

    .cal-day.muted {
      color: #b8c4d1;
    }

    .cal-day.start,
    .cal-day.end {
      background: var(--brand);
      color: #fff;
      font-weight: 700;
    }

    .cal-day.in-range {
      background: rgba(20, 88, 215, 0.16);
      border-radius: 0;
    }

    .cal-day.start.in-range {
      border-radius: 9px 0 0 9px;
    }

    .cal-day.end.in-range {
      border-radius: 0 9px 9px 0;
    }

    .range-text {
      font-size: 12px;
      color: #5d738c;
      margin: 8px 0;
      min-height: 16px;
    }

    .popover-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 10px;
    }

    .kpi-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 13px;
      background: #fff;
      min-height: 108px;
      min-width: 0;
      overflow: hidden;
    }

    .kpi-label {
      font-size: clamp(9px, 2.4vw, 11px);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #6f8093;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow-wrap: normal;
      word-break: keep-all;
    }

    .kpi-value {
      font-size: clamp(18px, 4.8vw, 31px);
      line-height: 1;
      font-weight: 800;
      color: #162b46;
      margin-bottom: 7px;
      white-space: nowrap;
      overflow-wrap: normal;
      word-break: keep-all;
    }

    .kpi-value>* {
      white-space: nowrap;
    }

    .kpi-sub {
      font-size: clamp(10px, 2.5vw, 12px);
      color: #71869b;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow-wrap: normal;
      word-break: keep-all;
    }

    .trend {
      font-size: clamp(10px, 2.6vw, 12px);
      font-weight: 700;
      white-space: nowrap;
      overflow-wrap: normal;
      word-break: keep-all;
    }

    .metric-band {
      border: 1px dashed #d7e3ef;
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 10px;
      background: #fcfdff;
    }

    .metric-band-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 800;
      color: #62798f;
      margin-bottom: 8px;
    }

    .trend.good {
      color: var(--good);
    }

    .trend.bad {
      color: var(--bad);
    }

    .trend.neutral {
      color: #8193a7;
    }

    .plan-progress {
      height: 8px;
      border-radius: 999px;
      background: #e7edf3;
      overflow: hidden;
      margin-top: 6px;
    }

    .plan-progress span {
      display: block;
      height: 100%;
      border-radius: 999px;
    }

    .chart-wrap {
      border: 1px solid #d6e2ef;
      border-radius: 14px;
      background: linear-gradient(180deg, #f9fcff 0%, #f0f6fc 100%);
      padding: 12px;
      position: relative;
    }

    .chart-legend {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      font-size: 12px;
      color: #6f8196;
      font-weight: 600;
      flex-wrap: wrap;
    }

    .chart-dot-plan {
      fill: #1458d7;
      cursor: pointer;
    }

    .chart-dot-fact {
      fill: #128a4a;
      cursor: pointer;
    }

    .chart-stats {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .chart-stat {
      border: 1px solid #d4e0ed;
      border-radius: 10px;
      padding: 6px 8px;
      background: #fff;
      min-height: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .chart-stat.plan {
      border-color: rgba(20, 88, 215, 0.35);
      background: rgba(20, 88, 215, 0.08);
    }

    .chart-stat.fact {
      border-color: rgba(18, 138, 74, 0.35);
      background: rgba(18, 138, 74, 0.08);
    }

    .chart-stat.progress {
      border-color: rgba(255, 159, 28, 0.35);
      background: rgba(255, 159, 28, 0.08);
    }

    .chart-stat-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #6b8098;
      font-weight: 700;
    }

    .chart-stat-value {
      font-size: 14px;
      font-weight: 800;
      color: #1d3554;
      line-height: 1.15;
      margin-top: 2px;
    }

    .chart-stat.progress .chart-stat-value {
      color: #8a4d00;
    }

    .chart-point-info {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 3;
      border: 1px solid #cfe0ef;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.96);
      padding: 8px 10px;
      font-size: 12px;
      color: #334a63;
      box-shadow: 0 6px 16px rgba(20, 47, 73, 0.12);
      white-space: nowrap;
    }

    .chart-point-info.hidden {
      display: none;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 6px;
      vertical-align: baseline;
    }

    .section-title {
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #5f7389;
      font-weight: 800;
      margin-bottom: 9px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d6e2ef;
      border-radius: 12px;
    }

    .table {
      margin-bottom: 0;
      font-size: 13px;
    }

    .table thead th {
      white-space: nowrap;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #5b7087;
      border-bottom-width: 1px;
      background: #f6f9fc;
      text-align: center;
    }

    .table tbody td {
      white-space: nowrap;
      vertical-align: middle;
      border-color: #ebf1f7;
      text-align: center;
    }

    .table thead th:not(:last-child),
    .table tbody td:not(:last-child) {
      border-right: 1px solid rgba(91, 112, 135, 0.18);
    }

    .sticky-first {
      position: sticky;
      left: 0;
      background: #fff;
      z-index: 1;
      box-shadow: 8px 0 8px -10px rgba(26, 47, 68, 0.35);
      text-align: left !important;
    }

    details>summary {
      list-style: none;
      cursor: pointer;
      user-select: none;
    }

    details>summary::-webkit-details-marker {
      display: none;
    }

    .muted-note {
      color: #6d8095;
      font-size: 12px;
    }

    @media (max-width: 991px) {
      .filter-grid {
        grid-template-columns: 1fr;
      }

      .kpi-grid {
        grid-template-columns: repeat(12, 1fr);
      }

      .kpi-card {
        grid-column: span 6 !important;
        min-height: 98px;
      }

      .table-wrap {
        max-width: calc(100vw - 36px);
      }
    }

    @media (max-width: 575px) {
      .kpi-grid {
        grid-template-columns: repeat(12, 1fr);
      }

      .kpi-grid-main .kpi-card {
        grid-column: span 4 !important;
        min-height: 88px;
        padding: 10px 9px;
      }

      .kpi-grid-main .kpi-label {
        font-size: 10px;
        margin-bottom: 5px;
      }

      .kpi-grid-main .kpi-value {
        font-size: clamp(16px, 4.6vw, 21px);
        margin-bottom: 5px;
      }

      .kpi-grid-main .trend {
        font-size: 11px;
      }

      .kpi-grid-main .kpi-card.kpi-mobile-full {
        grid-column: span 12 !important;
      }

      .date-popover {
        left: 50%;
        transform: translateX(-50%);
      }

      .kpi-value {
        font-size: 27px;
      }

      .kpi-card {
        grid-column: span 12 !important;
      }

      .chart-stats {
        grid-template-columns: 1fr;
      }

      .chart-point-info {
        font-size: 11px;
        max-width: calc(100% - 24px);
        white-space: normal;
      }

      .kpi-grid-3 .kpi-card {
        grid-column: span 4 !important;
      }

      .kpi-grid-3 .kpi-card.kpi-mobile-full {
        grid-column: span 12 !important;
      }
    }

    @media (max-width: 420px) {
      .kpi-grid-3 .kpi-card {
        grid-column: span 6 !important;
      }
    }

    @media (max-width: 340px) {
      .kpi-grid-3 .kpi-card {
        grid-column: span 12 !important;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <div class="topline">
      <div>
        <div class="text-uppercase" style="font-size:11px;color:#6f8093;font-weight:700;letter-spacing:.05em;">
          Користувач</div>
        <div id="uiUserName" style="font-size:24px;font-weight:800;line-height:1.15;">...</div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="role-badge"><i class="bi bi-shield-lock me-1"></i><span id="uiUserRole">...</span></span>
        <button class="btn btn-sm btn-light border" id="forceReloadBtn" title="Оновити"><i
            class="bi bi-arrow-clockwise"></i></button>
      </div>
    </div>

    <div class="panel-card p-3 mb-3" id="filtersCard">
      <div class="filters-head">
        <button class="filters-toggle" id="filtersToggleBtn" type="button">
          <i class="bi bi-funnel"></i>
          <span>Фільтри</span>
          <i class="bi bi-chevron-down" id="filtersToggleIcon"></i>
        </button>
      </div>
      <div class="filter-grid mt-2 d-none" id="filtersBody">
        <div class="date-picker-wrap">
          <label class="field-label">Період</label>
          <button class="field-btn" id="dateTrigger" type="button">
            <span id="dateTriggerLabel">...</span>
            <i class="bi bi-calendar3"></i>
          </button>
          <div class="date-popover d-none" id="datePopover">
            <div class="preset-row">
              <button class="preset-btn" data-preset="day" type="button">Вчора</button>
              <button class="preset-btn" data-preset="week" type="button">Тиждень</button>
              <button class="preset-btn" data-preset="month" type="button">Місяць</button>
              <button class="preset-btn" data-preset="prevMonth" type="button">Попер. місяць</button>
            </div>

            <div class="calendar-head">
              <button class="cal-nav" id="calPrev" type="button"><i class="bi bi-chevron-left"></i></button>
              <div class="calendar-title" id="calTitle">...</div>
              <button class="cal-nav" id="calNext" type="button"><i class="bi bi-chevron-right"></i></button>
            </div>
            <div class="calendar-grid" id="calWeekdays"></div>
            <div class="calendar-grid" id="calDays"></div>

            <div class="range-text" id="dateRangeText"></div>
            <div class="popover-actions">
              <button class="btn btn-sm btn-light border" id="dateCancel" type="button">Скасувати</button>
              <button class="btn btn-sm btn-primary" id="dateApply" type="button">Застосувати</button>
            </div>
          </div>
        </div>

        <div>
          <label class="field-label">Джерело</label>
          <select class="field-select" id="sourceFilter"></select>
        </div>

        <div id="managerField">
          <label class="field-label">Менеджер</label>
          <select class="field-select" id="managerFilter"></select>
        </div>

        <div>
          <button class="btn btn-dark w-100" id="applyFiltersBtn" style="min-height:44px;">Оновити</button>
        </div>
      </div>
    </div>

    <div id="appContent">
      <div class="text-center py-5">
        <div class="spinner-border text-primary"></div>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index:1080;">
      <div id="liveToast" class="toast text-bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="toastMessage">...</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <div id="debugPanel" class="panel-card p-3 d-none mt-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <strong>Debug</strong>
        <button class="btn btn-sm btn-outline-secondary" id="debugClose">Закрити</button>
      </div>
      <div class="small text-muted mb-2" id="debugMeta"></div>
      <pre class="small mb-0" id="debugBody" style="white-space: pre-wrap;"></pre>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzxOb7aq6buRdyVH0W-XICmFbbhbVzrS68RQVLR9Cyg0g89tP2qfh5qhdZ-qwbBMfqf0w/exec";
    const urlParams = new URLSearchParams(window.location.search);
    const USER_ID = urlParams.get('userid');
    const DEBUG = urlParams.get('debug') === '1';

    const state = {
      access: null,
      baseData: null,
      dataKey: '',
      filters: {
        source: 'усього',
        manager: 'усього'
      },
      range: {
        preset: 'day',
        start: '',
        end: ''
      },
      picker: {
        visible: false,
        viewMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
        tempStart: '',
        tempEnd: ''
      },
      chartSeries: null,
      debugLines: []
    };

    let toastInstance;

    window.addEventListener('load', init);

    async function init() {
      toastInstance = new bootstrap.Toast(document.getElementById('liveToast'), { delay: 2600 });
      bindEvents();
      initDefaultRange();

      if (!USER_ID) {
        showErrorCard('Не вказано User ID');
        return;
      }

      try {
        await fetchAccess();
        await ensureDataLoaded(true);
        renderFromCache();
      } catch (err) {
        showErrorCard('Помилка запуску: ' + escapeHtml(err.message || String(err)));
        pushDebug('init error: ' + String(err));
        showDebugIfNeeded();
      }
    }

    function bindEvents() {
      document.getElementById('forceReloadBtn').addEventListener('click', () => hardRefresh().catch(handleUiError));
      document.getElementById('applyFiltersBtn').addEventListener('click', () => {
        renderFromCache();
        if (window.innerWidth < 992) toggleFiltersPanel(false);
      });
      document.getElementById('filtersToggleBtn').addEventListener('click', () => {
        const body = document.getElementById('filtersBody');
        toggleFiltersPanel(body.classList.contains('d-none'));
      });

      document.getElementById('sourceFilter').addEventListener('change', onFilterChanged);
      document.getElementById('managerFilter').addEventListener('change', onFilterChanged);

      document.getElementById('dateTrigger').addEventListener('click', () => toggleDatePopover(true));
      document.getElementById('dateCancel').addEventListener('click', () => toggleDatePopover(false));
      document.getElementById('dateApply').addEventListener('click', applyDateSelection);
      document.getElementById('calPrev').addEventListener('click', () => shiftCalendarMonth(-1));
      document.getElementById('calNext').addEventListener('click', () => shiftCalendarMonth(1));

      document.getElementById('debugClose').addEventListener('click', () => document.getElementById('debugPanel').classList.add('d-none'));

      document.querySelectorAll('[data-preset]').forEach((btn) => {
        btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
      });

      document.getElementById('datePopover').addEventListener('click', (e) => e.stopPropagation());
      document.getElementById('dateTrigger').addEventListener('click', (e) => e.stopPropagation());

      document.addEventListener('click', (e) => {
        if (!state.picker.visible) return;
        const pop = document.getElementById('datePopover');
        const trigger = document.getElementById('dateTrigger');
        if (pop.contains(e.target) || trigger.contains(e.target)) return;
        toggleDatePopover(false);
      });
    }

    async function hardRefresh() {
      await fetchAccess(true);
      await ensureDataLoaded(true);
      renderFromCache();
      showToast('Дані та кеш оновлено');
    }

    function initDefaultRange() {
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const key = toDateKey(yesterday);
      state.range.preset = 'day';
      state.range.start = key;
      state.range.end = key;
      state.picker.tempStart = key;
      state.picker.tempEnd = key;
      state.picker.viewMonth = new Date(yesterday.getFullYear(), yesterday.getMonth(), 1);
      updateRangeTexts();
    }

    async function fetchAccess(force) {
      const res = await apiGet({ action: 'getAccess', userId: USER_ID, force: force ? '1' : '' });
      if (!res || res.error) throw new Error(res && res.error ? res.error : 'access_failed');

      state.access = res;
      if (!res.allowed) {
        document.getElementById('uiUserName').textContent = res.manager || 'Невідомо';
        document.getElementById('uiUserRole').textContent = res.role || 'Без доступу';
        document.getElementById('filtersCard').classList.add('d-none');
        showErrorCard('Доступ заборонено');
        return;
      }

      document.getElementById('uiUserName').textContent = res.manager || 'Менеджер';
      document.getElementById('uiUserRole').textContent = res.role || '';

      if (res.role !== 'Керівник') {
        document.getElementById('managerField').classList.add('d-none');
        state.filters.manager = res.manager || 'усього';
      }
    }

    async function ensureDataLoaded(force) {
      if (!state.access || !state.access.allowed) return;

      const key = `${state.range.start}|${state.range.end}`;
      if (!force && state.baseData && state.dataKey === key) return;

      document.getElementById('appContent').innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

      const payload = {
        action: 'getStats',
        userId: USER_ID,
        range: state.range.preset,
        start: state.range.start,
        end: state.range.end,
        force: force ? '1' : ''
      };

      const res = await apiGet(payload);
      if (res.error) throw new Error(res.error);

      state.baseData = res;
      state.dataKey = key;

      hydrateFiltersFromData();
      pushDebug('Data loaded for ' + key + ', rows: ' + totalRowsCount(res));
      showDebugIfNeeded();
    }

    function onFilterChanged() {
      state.filters.source = document.getElementById('sourceFilter').value || 'усього';
      state.filters.manager = document.getElementById('managerFilter').value || 'усього';
      renderFromCache();
    }

    function toggleFiltersPanel(expand) {
      const body = document.getElementById('filtersBody');
      const icon = document.getElementById('filtersToggleIcon');
      body.classList.toggle('d-none', !expand);
      icon.className = expand ? 'bi bi-chevron-up' : 'bi bi-chevron-down';
    }

    function hydrateFiltersFromData() {
      const data = state.baseData || {};
      const opts = data.options || {};
      const sources = Array.isArray(opts.sources) && opts.sources.length ? opts.sources : ['усього'];
      const managers = Array.isArray(opts.managers) && opts.managers.length ? opts.managers : ['усього'];

      const sourceSelect = document.getElementById('sourceFilter');
      const prevSource = state.filters.source;
      sourceSelect.innerHTML = sources.map((s) => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
      sourceSelect.value = sources.includes(prevSource) ? prevSource : 'усього';
      state.filters.source = sourceSelect.value;

      const managerSelect = document.getElementById('managerFilter');
      if (state.access.role === 'Керівник') {
        const prevManager = state.filters.manager;
        managerSelect.innerHTML = managers.map((m) => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
        managerSelect.value = managers.includes(prevManager) ? prevManager : 'усього';
        state.filters.manager = managerSelect.value;
      } else {
        const only = state.access.manager || 'усього';
        managerSelect.innerHTML = `<option value="${escapeHtml(only)}">${escapeHtml(only)}</option>`;
        state.filters.manager = only;
      }
    }

    function renderFromCache() {
      if (!state.access || !state.access.allowed || !state.baseData) return;

      updateRangeTexts();

      const ranges = state.baseData.ranges || {};
      const current = ranges.current || {};
      const previous = ranges.previous || {};

      const currentData = filterPeriodData(current.start, current.end);
      const previousData = filterPeriodData(previous.start, previous.end);

      const currentMetrics = computeMetrics(currentData);
      const previousMetrics = computeMetrics(previousData);

      const series = buildPlanFactSeries(currentData.ordersCompleted, current.start, current.end, state.baseData.plan ? state.baseData.plan.monthly : {});
      currentMetrics.planSales = series.planTotal;
      previousMetrics.planSales = calcPlanTotalForRange(previous.start, previous.end, state.baseData.plan ? state.baseData.plan.monthly : {});
      const sourcesRows = buildSourceRows(current.start, current.end);
      const dailyRows = buildDailyRows(current.start, current.end);
      const managerRows = state.access.role === 'Керівник' ? buildManagerRows(current.start, current.end) : [];
      state.chartSeries = series;

      document.getElementById('appContent').innerHTML = buildDashboardHtml({
        currentLabel: current.label || '',
        previousLabel: previous.label || '',
        currentMetrics,
        previousMetrics,
        series,
        sourcesRows,
        dailyRows,
        managerRows
      });
      initPlanChartDayInfo();
    }

    function filterPeriodData(startKey, endKey, fixedSource, fixedManager) {
      const ds = (state.baseData && state.baseData.datasets) || {};
      const sourceFilter = fixedSource || state.filters.source;
      const managerFilter = fixedManager || state.filters.manager;

      const passManager = (row) => {
        if (!managerFilter || managerFilter === 'усього') return true;
        return String(row.manager || '') === String(managerFilter);
      };
      const passSource = (row) => {
        if (!sourceFilter || sourceFilter === 'усього') return true;
        return String(row.source || '') === String(sourceFilter);
      };
      const passDate = (row) => row.date >= startKey && row.date <= endKey;

      return {
        ordersCreated: (ds.ordersCreated || []).filter((r) => passDate(r) && passManager(r) && passSource(r)),
        ordersCompleted: (ds.ordersCompleted || []).filter((r) => passDate(r) && passManager(r) && passSource(r)),
        leadsCreated: (ds.leadsCreated || []).filter((r) => passDate(r) && passManager(r) && passSource(r)),
        leadsUpdated: (ds.leadsUpdated || []).filter((r) => passDate(r) && passManager(r) && passSource(r)),
        // GA4 KPI should be aggregated only by date (no source slicing).
        ga4: (ds.ga4 || []).filter((r) => passDate(r))
      };
    }

    function computeMetrics(data) {
      const m = {
        visitorsTotal: 0,
        visitorsNew: 0,
        visitorsReturning: 0,

        planSales: 0,
        factSales: 0,
        planPercent: 0,

        leadsCreated: 0,
        leadsItems: 0,
        leadsAmount: 0,
        leadsChuykaItems: 0,
        leadsChuykaAmount: 0,

        leadsProcessed: 0,
        leadsSuccess: 0,
        leadsSuccessItems: 0,
        leadsSuccessAmount: 0,
        leadsSuccessChuykaItems: 0,
        leadsSuccessChuykaAmount: 0,

        ordersCreated: 0,
        ordersItems: 0,
        ordersAmount: 0,
        ordersChuykaItems: 0,
        ordersChuykaAmount: 0,

        ordersCompleted: 0,
        ordersCompletedItems: 0,
        ordersCompletedPaid: 0,

        avgCheck: 0
      };

      (data.ga4 || []).forEach((row) => {
        m.visitorsTotal += num(row.total);
        m.visitorsNew += num(row.newUsers);
        m.visitorsReturning += num(row.returning);
      });

      const leadCreatedSet = new Set();
      (data.leadsCreated || []).forEach((row) => {
        if (row.id) leadCreatedSet.add(row.id);
        m.leadsItems += num(row.qty);
        m.leadsAmount += num(row.amount);
        if (row.chuyka) {
          m.leadsChuykaItems += num(row.qty);
          m.leadsChuykaAmount += num(row.amount);
        }
      });
      m.leadsCreated = leadCreatedSet.size;

      const processedSet = new Set();
      const successSet = new Set();
      (data.leadsUpdated || []).forEach((row) => {
        if (row.id) processedSet.add(row.id);
        if (row.success && row.id) successSet.add(row.id);
        if (row.success) {
          m.leadsSuccessItems += num(row.qty);
          m.leadsSuccessAmount += num(row.amount);
          if (row.chuyka) {
            m.leadsSuccessChuykaItems += num(row.qty);
            m.leadsSuccessChuykaAmount += num(row.amount);
          }
        }
      });
      m.leadsProcessed = processedSet.size;
      m.leadsSuccess = successSet.size;

      const orderCreatedSet = new Set();
      (data.ordersCreated || []).forEach((row) => {
        if (row.id) orderCreatedSet.add(row.id);
        m.ordersItems += num(row.qty);
        m.ordersAmount += num(row.amount);
        if (row.chuyka) {
          m.ordersChuykaItems += num(row.qty);
          m.ordersChuykaAmount += num(row.amount);
        }
      });
      m.ordersCreated = orderCreatedSet.size;

      // Fact = closed orders (status 5) by completion date, paid sum
      let factSum = 0;
      (data.ordersCompleted || []).forEach((row) => {
        if (String(row.statusGroup) !== '5') return;
        factSum += num(row.paid) || num(row.amount);
      });
      m.factSales = factSum;

      const completedSet = new Set();
      (data.ordersCompleted || []).forEach((row) => {
        if (String(row.statusGroup) !== '5') return;
        if (row.id) completedSet.add(row.id);
        m.ordersCompletedItems += num(row.qty);
        const paid = num(row.paid);
        m.ordersCompletedPaid += paid > 0 ? paid : num(row.amount);
      });
      m.ordersCompleted = completedSet.size;
      m.avgCheck = m.ordersCompleted > 0 ? m.ordersCompletedPaid / m.ordersCompleted : 0;

      return m;
    }

    function buildPlanFactSeries(ordersCompletedRows, startKey, endKey, monthPlanMap) {
      const start = fromDateKey(startKey);
      const end = fromDateKey(endKey);
      if (!start || !end) return { points: [], max: 0, planTotal: 0, factTotal: 0 };

      const factByDate = {};
      (ordersCompletedRows || []).forEach((row) => {
        if (String(row.statusGroup) !== '5') return;
        factByDate[row.date] = (factByDate[row.date] || 0) + (num(row.paid) || num(row.amount));
      });

      const points = [];
      let planAcc = 0;
      let factAcc = 0;
      let maxDaily = 0;

      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        const dateKey = toDateKey(d);
        const monthKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        const monthlyPlan = num(monthPlanMap && monthPlanMap[monthKey]);
        const daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        const dailyPlan = daysInMonth > 0 ? monthlyPlan / daysInMonth : 0;
        const dailyFact = num(factByDate[dateKey]);

        planAcc += dailyPlan;
        factAcc += dailyFact;
        maxDaily = Math.max(maxDaily, dailyPlan, dailyFact);

        points.push({
          date: dateKey,
          label: formatDateShort(dateKey),
          dailyPlan: dailyPlan,
          dailyFact: dailyFact,
          plan: planAcc,
          fact: factAcc
        });
      }

      return {
        points,
        max: Math.max(planAcc, factAcc, 1),
        maxDaily: Math.max(maxDaily, 1),
        planTotal: planAcc,
        factTotal: factAcc
      };
    }

    function calcPlanTotalForRange(startKey, endKey, monthPlanMap) {
      const start = fromDateKey(startKey);
      const end = fromDateKey(endKey);
      if (!start || !end) return 0;

      let total = 0;
      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        const monthKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        const monthlyPlan = num(monthPlanMap && monthPlanMap[monthKey]);
        const daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        total += daysInMonth > 0 ? (monthlyPlan / daysInMonth) : 0;
      }
      return total;
    }

    function buildSourceRows(startKey, endKey) {
      const sourceList = ((state.baseData && state.baseData.options && state.baseData.options.sources) || [])
        .filter((s) => s && s !== 'усього');

      return sourceList.map((source) => {
        const data = filterPeriodData(startKey, endKey, source, state.filters.manager);
        const metrics = computeMetrics(data);
        return { source, metrics };
      }).sort((a, b) => a.source.localeCompare(b.source));
    }

    function buildDailyRows(startKey, endKey) {
      const rows = [];
      const start = fromDateKey(startKey);
      const end = fromDateKey(endKey);
      if (!start || !end) return rows;

      for (let d = new Date(end); d >= start; d.setDate(d.getDate() - 1)) {
        const key = toDateKey(d);
        const data = filterPeriodData(key, key);
        const metrics = computeMetrics(data);
        rows.push({ date: key, metrics });
      }

      return rows;
    }

    function buildManagerRows(startKey, endKey) {
      const managers = ((state.baseData && state.baseData.options && state.baseData.options.managers) || [])
        .filter((m) => m && m !== 'усього');

      return managers.map((manager) => {
        const data = filterPeriodData(startKey, endKey, state.filters.source, manager);
        return { manager, metrics: computeMetrics(data) };
      }).sort((a, b) => a.manager.localeCompare(b.manager));
    }

    function metricCard(label, value, trend, span, extra, className) {
      return `
        <div class="kpi-card ${className || ''}" style="grid-column:${span};">
          <div class="kpi-label">${label}</div>
          <div class="kpi-value">${value}</div>
          ${trend || '<div class="trend neutral">—</div>'}
          ${extra || ''}
        </div>
      `;
    }

    function trendHtml(current, previous, higherBetter) {
      const cur = num(current);
      const prev = num(previous);
      const diff = cur - prev;

      if (Math.abs(diff) < 0.000001 && Math.abs(cur) < 0.000001 && Math.abs(prev) < 0.000001) {
        return '<div class="trend neutral">без змін</div>';
      }

      const base = Math.abs(prev) > 0 ? (diff / Math.abs(prev)) : (cur !== 0 ? 1 : 0);
      const pct = Math.abs(base) * 100;

      let good = diff >= 0;
      if (!higherBetter) good = diff <= 0;

      const cls = diff === 0 ? 'neutral' : (good ? 'good' : 'bad');
      const sign = diff > 0 ? '+' : (diff < 0 ? '-' : '');

      return `<div class="trend ${cls}">${sign}${pct.toFixed(1)}%</div>`;
    }

    function buildPlanChartHtml(series) {
      if (!series || !series.points || !series.points.length) {
        return '<div class="muted-note">Немає даних для графіка.</div>';
      }
      return renderCumulativeChart(series);
    }

    function renderCumulativeChart(series) {
      const points = series.points;
      const isMobile = window.innerWidth <= 575;
      const width = isMobile ? 360 : 980;
      const height = isMobile ? 360 : 320;
      const pad = isMobile ? { top: 20, right: 10, bottom: 42, left: 8 } : { top: 20, right: 14, bottom: 36, left: 10 };
      const max = Math.max(series.max, 1);

      const x = (i) => {
        if (points.length === 1) return width / 2;
        return pad.left + (i / (points.length - 1)) * (width - pad.left - pad.right);
      };

      const y = (v) => pad.top + (1 - v / max) * (height - pad.top - pad.bottom);

      const line = (key) => points.map((p, i) => `${x(i)},${y(num(p[key]))}`).join(' ');
      const dots = points.map((p, i) => {
        const cx = x(i);
        const py = y(num(p.plan));
        const fy = y(num(p.fact));
        const title = `${p.label} | План: ${fmtMoney(num(p.plan))} | Факт: ${fmtMoney(num(p.fact))}`;
        return `
          <circle class="chart-dot-plan" data-point-index="${i}" cx="${cx}" cy="${py}" r="${points.length === 1 ? (isMobile ? 7 : 5) : (isMobile ? 4 : 3)}">
            <title>${escapeHtml(title)}</title>
          </circle>
          <circle class="chart-dot-fact" data-point-index="${i}" cx="${cx}" cy="${fy}" r="${points.length === 1 ? (isMobile ? 7 : 5) : (isMobile ? 4 : 3)}">
            <title>${escapeHtml(title)}</title>
          </circle>
        `;
      }).join('');
      const valueStep = points.length <= 10 ? 1 : Math.max(2, Math.floor(points.length / 8));
      const valueLabels = points.map((p, i) => {
        if (i % valueStep !== 0 && i !== points.length - 1) return '';
        const cx = x(i);
        const py = y(num(p.plan));
        const fy = y(num(p.fact));
        return `
          <text x="${cx + (isMobile ? 7 : 6)}" y="${py - (isMobile ? 10 : 8)}" font-size="${isMobile ? 14 : 10}" fill="#1458d7" font-weight="800" stroke="#fff" stroke-width="${isMobile ? 2.4 : 2}" paint-order="stroke">
            ${fmtMoney(num(p.plan))}
          </text>
          <text x="${cx + (isMobile ? 7 : 6)}" y="${fy + (isMobile ? 16 : 12)}" font-size="${isMobile ? 14 : 10}" fill="#128a4a" font-weight="800" stroke="#fff" stroke-width="${isMobile ? 2.4 : 2}" paint-order="stroke">
            ${fmtMoney(num(p.fact))}
          </text>
        `;
      }).join('');

      const factArea = points.map((p, i) => `${x(i)},${y(num(p.fact))}`).join(' ')
        + ` ${x(points.length - 1)},${height - pad.bottom} ${x(0)},${height - pad.bottom}`;

      const ticks = 4;
      const grid = [];
      for (let i = 0; i <= ticks; i++) {
        const ratio = i / ticks;
        const yy = pad.top + ratio * (height - pad.top - pad.bottom);
        grid.push(`<line x1="${pad.left}" y1="${yy}" x2="${width - pad.right}" y2="${yy}" stroke="#d7e3f1" stroke-dasharray="4 5"/>`);
      }

      const labelsStep = Math.max(1, Math.floor(points.length / 8));
      const labels = points.map((p, i) => {
        if (i % labelsStep !== 0 && i !== points.length - 1) return '';
        return `<text x="${x(i)}" y="${height - (isMobile ? 14 : 12)}" text-anchor="middle" font-size="${isMobile ? 13 : 11}" fill="#607892">${p.label}</text>`;
      }).join('');

      return `
        <div class="chart-wrap">
          <svg viewBox="0 0 ${width} ${height}" width="100%" height="${isMobile ? 360 : 320}" aria-label="План vs факт">
            ${grid.join('')}
            <polygon points="${factArea}" fill="rgba(18,138,74,.13)"></polygon>
            <polyline points="${line('plan')}" fill="none" stroke="#1458d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <title>План: ${fmtMoney(series.planTotal)}</title>
            </polyline>
            <polyline points="${line('fact')}" fill="none" stroke="#128a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <title>Факт: ${fmtMoney(series.factTotal)}</title>
            </polyline>
            ${dots}
            ${valueLabels}
            ${labels}
          </svg>
          <div class="chart-point-info hidden" id="chartPointInfo"></div>
          <div class="chart-stats">
            <div class="chart-stat plan" title="Накопичувальний план за період">
              <div class="chart-stat-label">План</div>
              <div class="chart-stat-value">${fmtMoney(series.planTotal)}</div>
            </div>
            <div class="chart-stat fact" title="Накопичувальний факт за період">
              <div class="chart-stat-label">Факт</div>
              <div class="chart-stat-value">${fmtMoney(series.factTotal)}</div>
            </div>
            <div class="chart-stat progress" title="Виконання плану">
              <div class="chart-stat-label">Виконання</div>
              <div class="chart-stat-value">${fmtPercent(series.planTotal > 0 ? (series.factTotal / series.planTotal) : 0)}</div>
            </div>
          </div>
        </div>
      `;
    }

    function initPlanChartDayInfo() {
      const info = document.getElementById('chartPointInfo');
      if (!info || !state.chartSeries || !state.chartSeries.points || !state.chartSeries.points.length) return;

      document.querySelectorAll('[data-point-index]').forEach((el) => {
        el.addEventListener('click', (evt) => {
          evt.stopPropagation();
          const idx = Number(el.getAttribute('data-point-index'));
          updatePlanChartDayInfo(idx);
        });
      });

      if (!state.chartOutsideBinded) {
        document.addEventListener('click', (e) => {
          const pointClicked = e.target && typeof e.target.closest === 'function' && e.target.closest('[data-point-index]');
          if (pointClicked) return;
          hidePlanChartDayInfo();
        });
        state.chartOutsideBinded = true;
      }
    }

    function updatePlanChartDayInfo(index) {
      const points = state.chartSeries && state.chartSeries.points ? state.chartSeries.points : [];
      const point = points[index];
      if (!point) return;

      const plan = num(point.dailyPlan);
      const fact = num(point.dailyFact);
      const pct = plan > 0 ? (fact / plan) : 0;

      const info = document.getElementById('chartPointInfo');
      if (!info) return;
      info.innerHTML = `<strong>${point.label}</strong> · План: <strong>${fmtMoney(plan)}</strong> · Факт: <strong>${fmtMoney(fact)}</strong> · <strong>${fmtPercent(pct)}</strong>`;
      info.classList.remove('hidden');
    }

    function hidePlanChartDayInfo() {
      const info = document.getElementById('chartPointInfo');
      if (!info) return;
      info.classList.add('hidden');
    }

    function buildSourcesTableHtml(rows) {
      const filtered = (rows || []).filter((r) => {
        const m = r.metrics || {};
        const sum = num(m.leadsCreated) + num(m.leadsItems) + num(m.leadsAmount) +
          num(m.leadsChuykaItems) + num(m.leadsChuykaAmount) + num(m.ordersCreated) +
          num(m.ordersItems) + num(m.ordersAmount) + num(m.ordersChuykaItems) +
          num(m.ordersChuykaAmount) + num(m.ordersCompleted) + num(m.ordersCompletedItems) +
          num(m.ordersCompletedPaid);
        return sum > 0;
      });
      if (!filtered.length) return '<div class="muted-note">Немає даних.</div>';

      return `
        <div class="table-wrap">
          <table class="table table-sm align-middle">

              <tr>
                <th class="sticky-first">Джерело</th>
                <th>Ліди створ.</th>
                <th>Лід. товари</th>
                <th>Лід. сума</th>
                <th>Чуйка лід. (шт/₴)</th>
                <th>Замовл. створ.</th>
                <th>Замовл. товари</th>
                <th>Замовл. сума</th>
                <th>Чуйка зам. (шт/₴)</th>
                <th>Заверш. зам.</th>
                <th>Заверш. товари</th>
                <th>Оплати заверш.</th>
              </tr>
            </thead>
            <tbody>
              ${filtered.map((r) => {
        const m = r.metrics;
        return `
                  <tr>
                    <td class="sticky-first fw-bold">${escapeHtml(r.source)}</td>
                    <td>${fmtNumber(m.leadsCreated)}</td>
                    <td>${fmtNumber(m.leadsItems)}</td>
                    <td>${fmtMoney(m.leadsAmount)}</td>
                    <td>${fmtNumber(m.leadsChuykaItems)} / ${fmtMoney(m.leadsChuykaAmount)}</td>
                    <td>${fmtNumber(m.ordersCreated)}</td>

                    <td>${fmtNumber(m.ordersCompleted)}</td>

                    <td>${fmtMoney(m.ordersCompletedPaid)}</td>
                  </tr>
                `;
      }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function buildDailyTableHtml(rows) {
      const filtered = (rows || []).filter((row) => {
        const m = row.metrics || {};

          num(m.leadsProcessed) + num(m.leadsSuccess) + num(m.leadsSuccessItems) +
          num(m.leadsSuccessAmount) + num(m.ordersCreated) + num(m.ordersItems) +
          num(m.ordersAmount) + num(m.ordersCompleted) + num(m.ordersCompletedPaid);
        return sum > 0;

      if (!filtered.length) return '<div class="muted-note">Немає даних.</div>';

      return `
        <div class="table-wrap">

              <tr>

                <th>Лід. товари</th>
                <th>Лід. сума</th>
                <th>Оброблено</th>
                <th>Успішні</th>
                <th>Усп. товари</th>
                <th>Усп. сума</th>

    function buildManagersTableHtml(rows) {
      if (!rows || !rows.length) return '<div class="muted-note">Немає даних.</div>';

      return `
        <div class="table-wrap">
          <table class="table table-sm align-middle">
            <thead>
              <tr>
                <th class="sticky-first">Менеджер</th>
                <th>Ліди створ.</th>
                <th>Оброблено</th>
                <th>Успішні</th>
                <th>Замовл. створ.</th>
                <th>Сума замовл.</th>
                <th>Заверш. зам.</th>
                <th>Оплати заверш.</th>
                <th>Сер. чек</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((r) => {

                  <tr>
                    <td class="sticky-first fw-bold">${escapeHtml(r.manager)}</td>
                    <td>${fmtNumber(m.leadsCreated)}</td>

                    <td>${fmtNumber(m.leadsSuccess)}</td>
                    <td>${fmtNumber(m.ordersCreated)}</td>

                `;

          </table>
        </div>

    function applyPreset(preset) {
      const today = new Date();
      let start;
      let end;

      if (preset === 'week') {
        const currentWeekMonday = new Date(today);
        const day = currentWeekMonday.getDay() === 0 ? 7 : currentWeekMonday.getDay();
        currentWeekMonday.setDate(currentWeekMonday.getDate() - day + 1);
        start = new Date(currentWeekMonday);
        start.setDate(start.getDate() - 7);
        end = new Date(start);
        end.setDate(end.getDate() + 6);
      } else if (preset === 'month') {
        end = new Date(today);
        start = new Date(today.getFullYear(), today.getMonth(), 1);
      } else if (preset === 'prevMonth') {
        start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        end = new Date(today.getFullYear(), today.getMonth(), 0);
      } else {
        start = new Date(today);
        start.setDate(start.getDate() - 1);
        end = new Date(start);
        preset = 'day';
      }

      state.range.preset = preset;
      state.range.start = toDateKey(start);
      state.range.end = toDateKey(end);

      state.picker.tempStart = state.range.start;
      state.picker.tempEnd = state.range.end;
      state.picker.viewMonth = new Date(start.getFullYear(), start.getMonth(), 1);

      highlightPresetButtons();
      updateDatePopoverRangeText();
      updateRangeTexts();
      toggleDatePopover(false);
      ensureDataLoaded(false).then(renderFromCache).catch(handleUiError);
    }

    function toggleDatePopover(show) {
      const pop = document.getElementById('datePopover');
      state.picker.visible = !!show;
      if (!show) {
        pop.classList.add('d-none');
        return;
      }

      state.picker.tempStart = state.range.start;
      state.picker.tempEnd = state.range.end;
      state.picker.viewMonth = new Date(fromDateKey(state.range.start).getFullYear(), fromDateKey(state.range.start).getMonth(), 1);

      renderCalendar();
      highlightPresetButtons();
      updateDatePopoverRangeText();
      pop.classList.remove('d-none');
    }

    function shiftCalendarMonth(delta) {
      const vm = state.picker.viewMonth;
      state.picker.viewMonth = new Date(vm.getFullYear(), vm.getMonth() + delta, 1);
      renderCalendar();
    }

    function renderCalendar() {
      const vm = state.picker.viewMonth;
      const year = vm.getFullYear();
      const month = vm.getMonth();
      const first = new Date(year, month, 1);
      const last = new Date(year, month + 1, 0);
      const offset = (first.getDay() + 6) % 7;

      document.getElementById('calTitle').textContent = monthTitle(vm);
      document.getElementById('calWeekdays').innerHTML = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд']
        .map((d) => `<div class="cal-weekday">${d}</div>`).join('');

      const cells = [];
      for (let i = 0; i < offset; i++) cells.push(null);
      for (let d = 1; d <= last.getDate(); d++) cells.push(new Date(year, month, d));
      while (cells.length < 42) cells.push(null);

      const start = state.picker.tempStart;
      const end = state.picker.tempEnd || start;

      document.getElementById('calDays').innerHTML = cells.map((date) => {
        if (!date) return '<button class="cal-day muted" type="button" disabled></button>';

        const key = toDateKey(date);
        const isStart = start && key === start;
        const isEnd = end && key === end;
        const inRange = start && end && key >= start && key <= end;

        let cls = 'cal-day';
        if (isStart) cls += ' start';
        if (isEnd && end !== start) cls += ' end';
        if (inRange) cls += ' in-range';

        return `<button class="${cls}" type="button" data-date="${key}">${date.getDate()}</button>`;
      }).join('');

      document.querySelectorAll('#calDays [data-date]').forEach((btn) => {
        btn.addEventListener('click', () => onCalendarDayClick(btn.dataset.date));
      });
    }

    function onCalendarDayClick(key) {
      if (!state.picker.tempStart || (state.picker.tempStart && state.picker.tempEnd)) {
        state.picker.tempStart = key;
        state.picker.tempEnd = '';
      } else {
        if (key < state.picker.tempStart) {
          state.picker.tempEnd = state.picker.tempStart;
          state.picker.tempStart = key;
        } else {
          state.picker.tempEnd = key;
        }
      }

      state.range.preset = 'custom';
      highlightPresetButtons();
      renderCalendar();
      updateDatePopoverRangeText();
    }

    function applyDateSelection() {
      if (!state.picker.tempStart) {
        showToast('Оберіть дату або діапазон');
        return;
      }

      state.range.start = state.picker.tempStart;
      state.range.end = state.picker.tempEnd || state.picker.tempStart;
      state.range.preset = 'custom';

      updateRangeTexts();
      toggleDatePopover(false);
      ensureDataLoaded(false).then(renderFromCache).catch(handleUiError);
    }

    function updateDatePopoverRangeText() {
      const start = state.picker.tempStart;
      const end = state.picker.tempEnd || state.picker.tempStart;
      const text = start ? `${formatDateLong(start)} — ${formatDateLong(end)}` : 'Оберіть дату';
      document.getElementById('dateRangeText').textContent = text;
    }

    function updateRangeTexts() {
      const label = `${formatDateLong(state.range.start)} — ${formatDateLong(state.range.end)}`;
      document.getElementById('dateTriggerLabel').textContent = label;
    }

    function highlightPresetButtons() {
      document.querySelectorAll('[data-preset]').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.preset === state.range.preset);
      });
    }

    function monthTitle(date) {
      return date.toLocaleDateString('uk-UA', { month: 'long', year: 'numeric' });
    }

    async function apiGet(params) {
      if (DEBUG) params.debug = '1';
      const q = new URLSearchParams(params).toString();
      const url = `${API_URL}?${q}`;
      if (DEBUG) pushDebug('GET ' + url);
      const res = await fetch(url);
      return await res.json();
    }

    function showErrorCard(msg) {
      document.getElementById('appContent').innerHTML = `<div class="alert alert-danger">${msg}</div>`;
    }

    function handleUiError(err) {
      console.error(err);
      showToast('Помилка: ' + (err && err.message ? err.message : String(err)));
      pushDebug('UI error: ' + String(err));
      showDebugIfNeeded();
    }

    function showToast(msg) {
      document.getElementById('toastMessage').textContent = msg;
      toastInstance.show();
    }

    function pushDebug(line) {
      if (!DEBUG) return;
      if (Array.isArray(line)) line.forEach((x) => state.debugLines.push(String(x)));
      else state.debugLines.push(String(line));
    }

    function showDebugIfNeeded() {
      if (!DEBUG) return;
      const panel = document.getElementById('debugPanel');
      panel.classList.remove('d-none');
      document.getElementById('debugMeta').textContent = 'API: ' + API_URL;
      document.getElementById('debugBody').textContent = state.debugLines.join('\n');
    }

    function totalRowsCount(res) {
      const ds = res && res.datasets ? res.datasets : {};
      return (ds.ordersCreated || []).length + (ds.ordersCompleted || []).length + (ds.leadsCreated || []).length + (ds.leadsUpdated || []).length + (ds.ga4 || []).length;
    }

    function num(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : 0;
    }

    function fmtNumber(v) {
      return num(v).toLocaleString('uk-UA');
    }

    function fmtMoney(v) {
      return num(v).toLocaleString('uk-UA', { maximumFractionDigits: 0 }) + '\u00A0₴';
    }

    function fmtMoneyShort(v) {
      const n = num(v);
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'м';
      if (n >= 1000) return (n / 1000).toFixed(0) + 'к';
      return n.toFixed(0);
    }

    function fmtPercent(v) {
      return (num(v) * 100).toFixed(1) + '%';
    }

    function toDateKey(d) {
      const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function fromDateKey(key) {
      if (!key) return null;
      const p = String(key).split('-');
      if (p.length !== 3) return null;
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    }

    function formatDateLong(key) {
      const d = fromDateKey(key);
      return d ? d.toLocaleDateString('uk-UA') : key;
    }

    function formatDateShort(key) {
      const d = fromDateKey(key);
      if (!d) return key;
      return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function percentToColor(ratio) {
      const x = Math.max(0, Math.min(1.2, num(ratio)));
      const clamped = Math.max(0, Math.min(1, x));
      const r = Math.round(216 - (216 - 26) * clamped);
      const g = Math.round(60 + (157 - 60) * clamped);
      const b = Math.round(60 - (60 - 46) * clamped);
      return `rgb(${r},${g},${b})`;
    }

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
